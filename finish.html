<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = window.supabase.createClient(
  "https://evwuxpkheshwexufybkz.supabase.co",
"sb_publishable_giERbwGTdXMPf4KC18hQ3Q_HJHafQ0M"
);

async function enregistrerReponse() {

  const { error } = await supabase
    .from("reponses")
    .insert([{
      lieu: localStorage.getItem("lieu"),
      jour: localStorage.getItem("jour"),
      message: localStorage.getItem("message"),
      reponse: localStorage.getItem("reponse")
    }]);

if (error) {
  alert(
    "Erreur :\n" +
    JSON.stringify(error, null, 2)
  );
} else {
  alert("✅ Réponse enregistrée !");
}

}

enregistrerReponse();
